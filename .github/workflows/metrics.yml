name: Metrics

# Gera metrics.svg com a atividade real, incluindo repositórios privados.
# Requer o secret METRICS_TOKEN: PAT classic com escopos repo, read:org e read:user
# (autorizado no SSO da organização, se ela exigir).
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: atualiza metrics.svg"
          user: Reasssc
          filename: metrics.svg
          template: classic
          config_timezone: America/Sao_Paulo
          # Só contagens: nenhum plugin que liste nomes de repositórios privados.
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
